services:
  hooks-workers:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3020:3020"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3020/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - directus-worker-network

networks:
  directus-worker-network:
    external: true
    name: ${NETWORK_NAME:-directus-worker-network}