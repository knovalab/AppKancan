services:
  # Development container for the application
  app:
    image: mcr.microsoft.com/devcontainers/base:debian-12
    container_name: appkancan_dev
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    ports:
      - "5173:5173"

  # Worker ETL de horas extras, con recarga automática (node --watch).
  # Comparte el código con `app` por el mismo volumen. Imagen Debian (glibc) como `app`,
  # para que node_modules sirva en los dos contenedores.
  etl:
    image: node:22-bookworm-slim
    container_name: appkancan_etl_dev
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace/services/horarios-etl
    environment:
      PORT: 3010
      TZ: America/Bogota
    # Variables de Directus (opcional): crear services/horarios-etl/.env a partir de .env.example
    command: sh -c "npm install --no-audit --no-fund && node --env-file-if-exists=.env --watch src/server.ts"
    ports:
      - "3010:3010"
    restart: unless-stopped
